name: Build and deploy ASP.Net Core app to Azure Web App - MOYO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build src/backend/Api/Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish src/backend/Api/Api.csproj -c Release -o ${{github.workspace}}/myapp

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MOYO'
          slot-name: 'Production'
          package: ${{github.workspace}}/myapp
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
